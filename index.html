<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatting Web App</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Authentication Screen (Name & Phone/Gmail) -->
    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Welcome to Chat App</h2>
            <p>Enter your Name and Phone/Gmail</p>
            
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Your Name">
            </div>
            <div class="input-group">
                <input type="text" id="auth-input" placeholder="Phone Number or Gmail">
            </div>
            <button id="login-btn">Save & Start Chat</button>
        </div>
    </div>

    <!-- Main Chat App Container -->
    <div class="app-container hidden" id="main-app">
        <!-- Sidebar / Chats List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="Profile" id="my-avatar">
                    <span id="display-username">My Profile</span>
                </div>
                <div class="sidebar-icons">
                    <i class="fa-solid fa-users" title="Create Group" id="open-group-modal"></i>
                    <i class="fa-solid fa-circle-notch" title="Status"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search or start new chat">
            </div>

            <div class="chat-list" id="chat-list">
                <!-- Default Chat Item -->
                <div class="chat-item active" data-chatname="General Group">
                    <img src="https://via.placeholder.com/45" alt="">
                    <div class="chat-info">
                        <h4>General Group</h4>
                        <p>Tap to chat...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Window -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="active-chat-info">
                    <img src="https://via.placeholder.com/40" alt="" id="active-chat-avatar">
                    <div>
                        <h3 id="active-chat-name">General Group</h3>
                        <span id="active-chat-status">online</span>
                    </div>
                </div>
                <div class="chat-header-icons">
                    <i class="fa-solid fa-user-plus" id="open-add-member-modal" title="Add Member to Group"></i>
                    <i class="fa-solid fa-video" id="video-call-btn" title="Video Call"></i>
                    <i class="fa-solid fa-phone" id="audio-call-btn" title="Voice Call"></i>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="message received">
                    <p>Welcome to the chat app!</p>
                    <span class="time">09:30 AM</span>
                </div>
            </div>

            <div class="chat-input-area">
                <label for="media-file-input">
                    <i class="fa-solid fa-paperclip" title="Attach Photo/Video"></i>
                </label>
                <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
                
                <input type="text" id="message-input" placeholder="Type a message...">
                
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Group Creation Modal -->
    <div class="modal hidden" id="group-modal">
        <div class="modal-content">
            <h3>Create New Group</h3>
            <input type="text" id="group-name-input" placeholder="Enter group name...">
            <div class="modal-buttons">
                <button id="create-group-btn">Create</button>
                <button id="close-modal-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal hidden" id="member-modal">
        <div class="modal-content">
            <h3>Add Member to Group</h3>
            <input type="text" id="member-input" placeholder="Enter Phone or Gmail of user...">
            <div class="modal-buttons">
                <button id="add-member-btn">Add</button>
                <button id="close-member-modal-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main JavaScript File as Module -->
    <script type="module" src="script.js"></script>
</body>
</html>
